<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery | Luhan Tang</title>
    <meta name="description" content="Photo Gallery | Luhan Tang" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Roboto+Serif:wght@400;500;600;700&display=swap"

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/profile.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .gallery-polaroid-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .gallery-card img {
        width: 100%;
        display: block;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .gallery-card img.loaded {
        opacity: 1;
      }
      .gallery-card {
        margin: 0;
        background: rgba(160, 190, 210, 0.25);
        min-height: 60px;
      }
      #gallery-sentinel {
        height: 40px;
        margin: 20px 0 40px;
      }
      #gallery-loader {
        display: none;
        text-align: center;
        padding: 16px 0 32px;
        color: rgba(22, 35, 49, 0.55);
        font-family: "Roboto Serif", Georgia, serif;
        font-size: 0.92rem;
        letter-spacing: 0.5px;
      }
      #gallery-loader.visible { display: block; }
      #gallery-done {
        display: none;
        text-align: center;
        padding: 12px 0 48px;
        color: rgba(22, 35, 49, 0.42);
        font-family: "Playfair Display", serif;
        font-size: 0.88rem;
        letter-spacing: 1px;
      }
      #gallery-done.visible { display: block; }
      @media (max-width: 900px) {
        .gallery-polaroid-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        .gallery-polaroid-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="gallery-page">
    <main>
      <section class="gallery-intro">
        <div class="wrap gallery-intro-wrap reveal">
          <h1>
            <span class="gallery-title-line gallery-title-main">Explore the world through my lens, <span>and</span></span>
            <span class="gallery-title-line">capture light, places, and</span>
            <span class="gallery-title-line">stories together.</span>
          </h1>
          <p class="gallery-lead">
            Come wander with me through quiet light, distant streets, and small moments the camera remembers.
          </p>
        </div>
      </section>

      <section class="gallery-showcase wrap">
        <div class="gallery-polaroid-grid" id="gallery-grid"></div>
        <div id="gallery-loader">Loading…</div>
        <div id="gallery-sentinel"></div>
        <div id="gallery-done">— end of gallery —</div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-wrap">
        <div>
          <p class="copyright">Luhan Tang &copy; 2026, all rights reserved</p>
        </div>
        <p class="motto">Small Blessings, Full Hearts</p>
      </div>
    </footer>

      const BASE = "assets/gallery/";
      const COLUMNS = 3;
      const BATCH_ROWS = 4;
      const BATCH = COLUMNS * BATCH_ROWS;
      let cursor = 0;
      let loading = false;
      let orderedImages = [];

      const grid = document.getElementById("gallery-grid");
      const sentinel = document.getElementById("gallery-sentinel");
      const loader = document.getElementById("gallery-loader");
      const doneMsg = document.getElementById("gallery-done");

      function buildCard(filename) {
        const fig = document.createElement("figure");
        fig.className = "gallery-card";

        const img = document.createElement("img");
        img.src = BASE + filename;
        img.alt = filename.replace(/\.[^.]+$/, "");
        img.width = 400;
        img.loading = "eager";
        img.decoding = "async";
        img.onload = () => img.classList.add("loaded");
        img.onerror = () => img.classList.add("loaded");

        fig.appendChild(img);
        return fig;
      }

      function classifyImage(filename) {
        return new Promise((resolve) => {
          const probe = new Image();
          probe.onload = () => {
            resolve({
              filename,
              portrait: probe.naturalHeight >= probe.naturalWidth,
            });
          };
          probe.onerror = () => {
            resolve({ filename, portrait: true });
          };
          probe.src = BASE + filename;
        });
      }

      async function buildOrderedImages() {
        const classified = await Promise.all(IMAGES.map(classifyImage));
        const portraits = classified.filter((item) => item.portrait).map((item) => item.filename);
        const landscapes = classified.filter((item) => !item.portrait).map((item) => item.filename);
        orderedImages = portraits.concat(landscapes);
      }

      function renderBatch() {
        if (loading || cursor >= orderedImages.length) return;
        loading = true;
        loader.classList.add("visible");

        const end = Math.min(cursor + BATCH, orderedImages.length);
        const fragment = document.createDocumentFragment();

        for (let i = cursor; i < end; i++) {
          fragment.appendChild(buildCard(orderedImages[i]));
        }

        grid.appendChild(fragment);
        cursor = end;
        loading = false;
        loader.classList.remove("visible");

        if (cursor >= orderedImages.length) {
          sentinel.remove();
          doneMsg.classList.add("visible");
          batchObserver.disconnect();
        }
      }

      const batchObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) renderBatch();
      }, { rootMargin: "500px 0px" });

      const SCROLL_KEY = "gallery_scroll";
      const savedScroll = sessionStorage.getItem(SCROLL_KEY);

      async function initGallery() {
        loader.textContent = "Organizing photos...";
        loader.classList.add("visible");
        await buildOrderedImages();
        loader.textContent = "Loading…";
        batchObserver.observe(sentinel);
        renderBatch();

        if (savedScroll) {
          const targetY = parseInt(savedScroll, 10);
          const batches = Math.ceil(targetY / (BATCH_ROWS * 240)) + 1;
          for (let b = 0; b < batches && cursor < orderedImages.length; b++) renderBatch();
          requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, targetY)));
        }
      }

      initGallery();

      let scrollTimer;
      window.addEventListener("scroll", () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          sessionStorage.setItem(SCROLL_KEY, Math.round(window.scrollY));
        }, 200);
      }, { passive: true });

      window.addEventListener("pagehide", () => {
        sessionStorage.setItem(SCROLL_KEY, Math.round(window.scrollY));
      });
    </script>
